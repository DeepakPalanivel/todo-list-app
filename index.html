<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>My To-Do List 📝</h1>
    <p class="subtitle">Organize your day, one task at a time.</p>

    <form id="task-form">
      <input type="text" id="task-input" placeholder="Enter a new task..." required maxlength="200">
      <button type="submit">Add Task</button>
    </form>

    <p id="task-count" aria-live="polite">0 tasks remaining</p>
    <ul id="task-list"></ul>
    <p id="empty-state">No tasks yet. Add your first task above!</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
